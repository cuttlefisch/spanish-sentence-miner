[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spanish-sentence-miner"
version = "0.1.0"
description = "Mine i+1 Spanish study sentences from EPUBs, with deterministic morphology and frequency banding."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Hayden Stanko", email = "system.cuttle@gmail.com" }]
keywords = ["spanish", "language-learning", "spacy", "nlp", "epub", "sentence-mining", "morphology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Education",
    "Typing :: Typed",
]
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "spacy>=3.8.7",
    # Pin spaCy's C-extension transitive deps to versions that publish cp313 wheels — the
    # resolver otherwise picks srsly 2.4.8 (no cp313 wheel, won't compile against the 3.13
    # C API). Carried over from calibre-to-anki-conversion/MAINTAINING.md.
    "srsly>=2.5.1",
    "thinc>=8.3.4",
    "wordfreq>=3.1",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/cuttlefisch/spanish-sentence-miner"
Repository = "https://github.com/cuttlefisch/spanish-sentence-miner"
Issues = "https://github.com/cuttlefisch/spanish-sentence-miner/issues"
Changelog = "https://github.com/cuttlefisch/spanish-sentence-miner/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/spanish_sentence_miner"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["spanish_sentence_miner"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
