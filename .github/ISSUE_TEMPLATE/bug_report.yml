name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code and, if relevant, a small/public-domain EPUB or sentence.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: spanish-sentence-miner version + Python version + spaCy model version.
    validations:
      required: true
