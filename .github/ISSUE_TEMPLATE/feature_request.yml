name: Feature request
description: Suggest an idea (kept tool-agnostic)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that's hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This stays language/tool-agnostic (no Anki/Calibre/web coupling)
          required: true
