name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy || true   # advisory until the spaCy stubs settle; never blocks CI
      - name: Test
        run: pytest
