name: Lint PR title

# Squash-merges use the PR title as the commit message, which release-please parses.
# Enforce Conventional Commits on PR titles so versioning stays automatic.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
