name: Auto-update PR branches

# "Automatic backmerge" + drain: when main advances (or on demand), merge green Dependabot
# PRs and bring the rest up to date. Two tokens by necessity:
#   - GITHUB_TOKEN merges (fine-grained PATs get "Resource not accessible" on mergePullRequest)
#   - RELEASE_PLEASE_TOKEN backmerges (re-triggers CI, and can touch workflow files)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-prs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPDATE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      MERGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Merge green Dependabot PRs; backmerge the rest
        run: |
          GH_TOKEN="$UPDATE_TOKEN" gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,isDraft,author \
            --jq '.[] | select(.isDraft==false) | "\(.number) \(.author.login)"' \
          | while read -r n author; do
              echo "PR #$n (author: $author)"
              merged=""
              case "$author" in
                dependabot*|app/dependabot)
                  # green + clean → --auto errors ("clean status"), so fall back to direct merge
                  if out=$(GH_TOKEN="$MERGE_TOKEN" gh pr merge --auto --squash "$n" --repo "$GITHUB_REPOSITORY" 2>&1); then
                    echo "  auto-merge enabled"; merged=1
                  elif out=$(GH_TOKEN="$MERGE_TOKEN" gh pr merge --squash "$n" --repo "$GITHUB_REPOSITORY" 2>&1); then
                    echo "  merged directly (already green)"; merged=1
                  else
                    echo "  not mergeable yet: $out"
                  fi
                  ;;
              esac
              # If not merged (pending/red/human PR), backmerge main to refresh + re-trigger CI.
              if [ -z "$merged" ]; then
                if GH_TOKEN="$UPDATE_TOKEN" gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$n/update-branch" \
                     -H "Accept: application/vnd.github+json" >/dev/null 2>&1; then
                  echo "  backmerged main (CI will re-run)"
                else
                  echo "  (already up to date)"
                fi
              fi
            done
