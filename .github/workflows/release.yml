name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write        # create tags, releases, and the release commit
  pull-requests: write   # open/maintain the release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT makes release-please's PRs trigger CI (the default GITHUB_TOKEN can't, to
          # avoid workflow recursion). Falls back to GITHUB_TOKEN until the secret is added.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
